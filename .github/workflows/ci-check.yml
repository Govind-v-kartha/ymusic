name: ci-check

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_BUILD_REPO: ymusic-io/ffmpeg-build
  FFMPEG_BUILD_REF: d0a89492c442dbca24dfabd044b866299f0a97b1
  NDK_VERSION: 28.2.13676358

jobs:
  checks:
    name: Sanity Checks (Resources & Contrast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Android Resources
        run: python tools/check_resources.py

      - name: Verify Theme Contrast
        run: python tools/check_contrast.py

  android-compile:
    name: Android Release Compile & Lint Vital
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: YMusicV4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache ffmpeg android-arm64-v8a
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-build/out/android-arm64-v8a
          key: ci-ffmpeg-android-arm64-v8a-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}

      - name: Checkout ffmpeg-build
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FFMPEG_BUILD_REPO }}
          ref: ${{ env.FFMPEG_BUILD_REF }}
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      - name: Build ffmpeg android-arm64-v8a
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        working-directory: ffmpeg-build
        run: |
          sudo apt-get update && sudo apt-get install -y nasm automake autoconf libtool pkg-config patchelf
          scripts/build-android.sh arm64-v8a

      - name: Compile Android Release & Run Lint Vital
        working-directory: YMusicV4
        env:
          YMUSIC_ABIS: arm64-v8a
        run: ./gradlew :androidApp:compileReleaseKotlin :androidApp:lintVitalAnalyzeRelease

  desktop-compile:
    name: Desktop Compile (JVM)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev

      - name: Compile Desktop Kotlin
        run: ./gradlew :commonUi:compileKotlinJvm :desktopApp:compileKotlinJvm -x :quickjs:cmakeConfigure -x :quickjs:cmakeBuild -x :mse:mseCmakeBuild -x :mse:mseCmakeConfigure

  tests:
    name: Unit & UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM Tests
        run: ./gradlew :player:jvmTest :settings:jvmTest :commonUi:jvmTest --tests io.ymusic.ui.playhistory.PlayHistorySchemaMigrationTest --tests io.ymusic.ui.ThemePreviewTest :desktopApp:jvmTest -x :syncFfmpegHost -x :quickjs:cmakeConfigure -x :quickjs:cmakeBuild -x :mse:mseCmakeBuild -x :mse:mseCmakeConfigure
